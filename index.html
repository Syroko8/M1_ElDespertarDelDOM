<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1_ElDespertarDelDOM</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./snake.js" defer></script>
</head>
<body>
    <div class="console">
        <div class="gray-wrapper">
            <div class="led"></div>
            <p class="wrapper-label">DOT MATRIX WITH STEREO SOUND</p>
            <div class="stats">
                <div id="score">SCORE 0</div>
                <div id="best-score">BEST 0</div>
            </div>
            <div class="screen-wrap">
                <div class="board-wrap">
                    <div class="board" id="board"></div>
                    <div class="overlay" id="overlay">
                        <p id="overlayText">Atrapa los orbes de energía!!!<br>Press START</p>
                    </div>
                </div>
            </div>
        </div>
        <div class="controls">
            <div class="cross">
                <button class="up">▲</button>
                <button class="left">◄</button>
                <div class="center"></div>
                <button class="right">►</button>
                <button class="down">▼</button>
            </div>
            <div class="ab">
                <div class="ab-item">
                    <button class="ab-button"></button>
                    <div class="ab-label">A</div>
                </div>
                <div class="ab-item">
                    <button class="ab-button"></button>
                    <div class="ab-label">B</div>
                </div>
            </div>
        </div>
        <div class="bottom">
            <div class="start-buttons">
                <div class="menu-item">
                    <button class="thin-button"></button>
                    <div class="label">SELECT</div>
                </div>
                <div class="menu-item">
                    <button class="thin-button"></button>
                    <div class="label">START</div>
                </div>
            </div>
        <div class="speaker"></div>
        </div>
    </div>
</body>
</html>
